<div class="l-robot-page">
    <div class="l-robot-container">
        <app-playground></app-playground>
    </div>

    <div class="l-robot-actions">
        <button class="l-robot-actions__btn" (click)="left()">Left</button>
        <button class="l-robot-actions__btn" (click)="move()">Move</button>
        <button class="l-robot-actions__btn" (click)="right()">Right</button>
    </div>
    <div class="l-robot-report">
        <button (click)="report()">Report</button>
    </div>
</div>
